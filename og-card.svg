<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FAF9F5"/>
  <rect x="0" y="0" width="1200" height="10" fill="#C8E829"/>
  <!-- wordmark -->
  <text x="80" y="118" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="900" letter-spacing="1" fill="#17181C">SITELOG <tspan fill="#6E7D00">AI</tspan></text>
  <!-- headline -->
  <text x="80" y="270" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="#17181C">The record belongs</text>
  <text x="80" y="366" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="-2" fill="#17181C">to the <tspan fill="#C25A0E">job.</tspan></text>
  <!-- subline -->
  <text x="80" y="446" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#565B63">The construction daily log app your whole crew will use.</text>
